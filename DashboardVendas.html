<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Banco de Dados e Gráfico</title>
    <!-- Adicionando Chart.js para criar gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .dashboard {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .panel {
            flex: 1;
            min-width: 300px;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            background: #fff;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #3498db;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"], input[type="number"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
        }
        button {
            padding: 8px 15px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #27ae60;
        }
        canvas {
            background: #fff;
            border-radius: 8px;
            padding: 10px;
        }
        .description {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Exemplo de Banco de Dados e Gráfico</h1>
    <p class="description">Este é um exemplo prático. A tabela à esquerda age como uma "planilha/banco de dados". O gráfico à direita lê esses dados e se atualiza visualmente.</p>

    <div class="dashboard">
        <!-- PLANILHA / BANCO DE DADOS -->
        <div class="panel">
            <h2>Planilha de Vendas (Dados)</h2>
            <table id="tabela-vendas">
                <thead>
                    <tr>
                        <th>Mês</th>
                        <th>Vendas (R$)</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela">
                    <!-- Os dados serão inseridos aqui pelo JavaScript -->
                </tbody>
            </table>

            <h3>Adicionar novo dado</h3>
            <div class="form-group">
                <input type="text" id="input-mes" placeholder="Ex: Junho" />
                <input type="number" id="input-valor" placeholder="Valor (Ex: 1500)" />
                <button onclick="adicionarDado()">Adicionar</button>
            </div>
        </div>

        <!-- GRÁFICO / VISUALIZAÇÃO -->
        <div class="panel">
            <h2>Visualização em Gráfico</h2>
            <canvas id="graficoVendas"></canvas>
        </div>
    </div>
</div>

<script>
    // Nosso "Banco de Dados" simulado na memória
    let bancoDeDados = [
        { mes: "Janeiro", valor: 1200 },
        { mes: "Fevereiro", valor: 1900 },
        { mes: "Março", valor: 1500 },
        { mes: "Abril", valor: 2200 },
        { mes: "Maio", valor: 1800 }
    ];

    let meuGrafico; // Variável para armazenar a instância do gráfico

    // Função para atualizar a tabela HTML
    function atualizarTabela() {
        const corpoTabela = document.getElementById('corpo-tabela');
        corpoTabela.innerHTML = ''; // Limpa a tabela

        bancoDeDados.forEach(dado => {
            const linha = document.createElement('tr');
            linha.innerHTML = `<td>${dado.mes}</td><td>R$ ${dado.valor.toFixed(2)}</td>`;
            corpoTabela.appendChild(linha);
        });
    }

    // Função para atualizar/renderizar o Gráfico
    function atualizarGrafico() {
        const ctx = document.getElementById('graficoVendas').getContext('2d');
        
        // Preparando os dados para o Chart.js
        const rotulosMeses = bancoDeDados.map(dado => dado.mes);
        const valoresVendas = bancoDeDados.map(dado => dado.valor);

        // Se o gráfico já existe, nós o destruímos antes de criar um novo para atualizar
        if (meuGrafico) {
            meuGrafico.destroy();
        }

        meuGrafico = new Chart(ctx, {
            type: 'bar', // Pode mudar para 'line', 'pie', etc.
            data: {
                labels: rotulosMeses,
                datasets: [{
                    label: 'Vendas (R$)',
                    data: valoresVendas,
                    backgroundColor: 'rgba(52, 152, 219, 0.6)',
                    borderColor: 'rgba(41, 128, 185, 1)',
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }

    // Função chamada pelo botão "Adicionar"
    function adicionarDado() {
        const inputMes = document.getElementById('input-mes');
        const inputValor = document.getElementById('input-valor');

        const mes = inputMes.value.trim();
        const valor = parseFloat(inputValor.value);

        if (mes === '' || isNaN(valor)) {
            alert('Por favor, insira um mês e um valor numérico válido.');
            return;
        }

        // Adiciona ao "banco de dados"
        bancoDeDados.push({ mes: mes, valor: valor });

        // Limpa os campos
        inputMes.value = '';
        inputValor.value = '';

        // Atualiza a tela (tabela e gráfico)
        atualizarTabela();
        atualizarGrafico();
    }

    // Inicialização quando a página carrega
    window.onload = () => {
        atualizarTabela();
        atualizarGrafico();
    };
</script>

</body>
</html>
